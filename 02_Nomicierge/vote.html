<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomicierge｜投票</title>
<meta name="description" content="飲み会コンシェルジュ Nomicierge。候補3店から行きたいお店に投票する画面。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
/* --- vote.html 固有スタイル(共通部品は css/theme.css) --- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

.page{max-width:640px;margin:0 auto;padding:32px clamp(16px,4vw,32px) 64px}
.page-head{text-align:center;margin-bottom:26px}
.page-head .sub{font-size:13.5px;color:var(--text-muted);margin-top:8px}
.back-row{margin-bottom:10px}
.back-row a{font-size:13px;color:var(--text-muted)}
.back-row a:hover{color:var(--teal)}

/* コンシェルジュの挨拶 */
.greet{display:flex;gap:10px;margin-bottom:18px}
.greet-icon{width:34px;height:34px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--coral);flex:none;display:flex;align-items:center;justify-content:center;margin-top:2px}
.greet-bubble{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 14px 0;padding:13px 16px}
.greet-bubble .txt{font-size:14px;line-height:2;color:var(--text)}
.greet-bubble .sub{color:var(--text-muted);font-size:12.5px}

.name-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 15px;margin-bottom:16px}
.name-row .lbl{font-size:12px;color:var(--text-muted);flex:none}
.name-input{flex:1;min-width:0;padding:9px 12px;font-size:14px;border:1px solid var(--border-strong);border-radius:9px;background:#1c1526;color:var(--text)}
.name-input:focus{border-color:var(--teal);outline:none}

/* 候補カード */
.ccard{position:relative;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:16px 16px 14px;margin-bottom:12px;cursor:pointer;font-family:inherit;color:var(--text);transition:border-color .15s,background .15s}
.ccard:hover{border-color:var(--teal)}
.ccard.sel{border:2px solid var(--teal);background:var(--teal-dim)}
.ccard .pos{font:600 11px ui-monospace,Menlo,monospace;color:var(--coral);letter-spacing:.05em}
.ccard .nm{font-family:var(--font-serif);font-size:17px;font-weight:600;color:var(--text);margin:3px 0 8px}
.ccard .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.ccard .tag{font-size:10.5px;color:var(--teal);background:rgba(61,219,192,.1);border:1px solid rgba(61,219,192,.25);border-radius:99px;padding:3px 9px}
.ccard .reason{font-size:12.5px;line-height:1.8;color:var(--text-muted);margin-bottom:9px}
.ccard .link{font-size:11.5px}
.ccard .cdot{position:absolute;top:16px;right:14px;width:16px;height:16px;border-radius:99px;border:1.5px solid var(--border-strong);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center}
.ccard.sel .cdot{border-color:var(--teal)}
.ccard .cdot-in{width:8px;height:8px;border-radius:99px;background:transparent;transition:background .15s}
.ccard.sel .cdot-in{background:var(--teal)}
.ccard .voters{display:flex;flex-wrap:wrap;align-items:center;gap:5px;border-top:1px solid var(--border);padding-top:9px;font-size:11px;color:var(--text-muted)}
.ccard .voters .cnt{font-weight:bold;color:var(--teal)}
.voter-chip{font-size:11px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:2px 9px}

/* 送信バー */
.sticky{position:sticky;bottom:0;background:rgba(22,17,29,.9);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:14px 0 16px;margin-top:6px}
.errbox{font-size:12px;color:var(--err);background:rgba(255,125,144,.08);border:1px solid rgba(255,125,144,.3);border-radius:9px;padding:9px 12px;margin-bottom:10px}
.submit{width:100%;padding:16px 0;border-radius:var(--radius-pill);border:none;cursor:pointer;font-size:15px;font-weight:bold;font-family:inherit;color:var(--text-faint);background:var(--surface-2);box-shadow:none;transition:background .25s,box-shadow .25s,color .25s}
.submit.ready{background:var(--grad-cta);color:#fff;box-shadow:var(--shadow-cta)}
.foot-note{text-align:center;font-size:10.5px;color:var(--text-faint);margin-top:9px}

/* 待機・決定ビュー */
.center-view{padding:44px 20px 40px;text-align:center;animation:rise .45s ease both}
.center-icon{width:68px;height:68px;border-radius:99px;background:var(--surface);border:1px solid var(--border-strong);color:var(--coral);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.center-title{font-family:var(--font-serif);font-size:21px;font-weight:600;color:var(--text);line-height:1.9;margin-bottom:10px}
.center-sub{font-size:13px;line-height:1.9;color:var(--text-muted);margin-bottom:24px}
.wait-note{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--text-muted)}
.wait-dot{width:7px;height:7px;border-radius:99px;background:var(--teal);animation:pulse 1.6s ease-in-out infinite}

.decided-card{text-align:left;background:var(--surface);border:2px solid var(--coral);border-radius:16px;padding:18px;margin-bottom:20px}
.decided-card .nm{font-family:var(--font-serif);font-size:19px;font-weight:600;color:var(--text);margin-bottom:8px}
.decided-card .tag{font-size:10.5px;color:var(--teal);background:rgba(61,219,192,.1);border:1px solid rgba(61,219,192,.25);border-radius:99px;padding:3px 9px}
.tally{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:20px}
.tally-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.tally-row:last-child{border-bottom:none}
.tally-row .k{color:var(--text)}
.tally-row .v{color:var(--text-muted);text-align:right}

[hidden]{display:none !important}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="index.html" id="navHome"><span class="bell-logo" aria-hidden="true"><i></i></span>Nomicierge</a>
  <div class="nav-links">
    <a href="answer.html" id="navAnswer">回答する</a>
    <a href="organizer.html" id="navOrganizer">幹事画面</a>
    <a class="btn-outline-coral" href="create.html" id="navCreate">イベントを作る</a>
  </div>
</nav>

<div class="page">

  <div class="back-row"><a href="answer.html" id="backLink">← 条件入力へ戻る</a></div>

  <div class="page-head">
    <div class="eyebrow">NOMICIERGE</div>
    <h1 class="page-title serif">みんなの投票</h1>
    <div class="sub"><span id="hdEventName">…</span><span id="hdEventInfo" style="margin-left:8px"></span></div>
  </div>

  <!-- 候補待ち / 未設定 -->
  <div class="center-view" id="viewWaiting">
    <div class="center-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5.4" r="1.4" fill="currentColor"></circle><path d="M4.8 17a7.2 7.2 0 0 1 14.4 0Z" fill="currentColor"></path><rect x="3.4" y="17.6" width="17.2" height="1.9" rx=".95" fill="currentColor"></rect></svg>
    </div>
    <div class="center-title" id="waitTitle">候補をご用意しています。</div>
    <div class="center-sub" id="waitSub">皆さまの条件が揃いましたら、<br>コンシェルジュが候補をお届けします。</div>
    <div class="wait-note" id="waitPulse"><span class="wait-dot"></span>このままお待ちください。自動で切り替わります。</div>
  </div>

  <!-- 投票 -->
  <div id="viewVote" hidden>
    <div class="greet">
      <div class="greet-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5.4" r="1.4" fill="currentColor"></circle><path d="M4.8 17a7.2 7.2 0 0 1 14.4 0Z" fill="currentColor"></path><rect x="3.4" y="17.6" width="17.2" height="1.9" rx=".95" fill="currentColor"></rect></svg>
      </div>
      <div class="greet-bubble">
        <div class="txt serif">3つの候補をご用意しました。<br><span class="sub">— この中からどれがいいですか?</span></div>
      </div>
    </div>

    <div class="name-row">
      <span class="lbl">お名前</span>
      <input class="name-input" id="voterName" placeholder="条件入力と同じ名前で" maxlength="30" autocomplete="off">
    </div>

    <div id="candidateList"></div>

    <div class="sticky">
      <div class="errbox" id="errBox" hidden></div>
      <button class="submit" id="voteBtn">この店に投票する</button>
      <div class="foot-note">投票は全員に名前つきで表示されます。何度でも選び直せます。</div>
    </div>
  </div>

  <!-- 決定 -->
  <div class="center-view" id="viewDecided" hidden>
    <div class="center-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5.4" r="1.4" fill="currentColor"></circle><path d="M4.8 17a7.2 7.2 0 0 1 14.4 0Z" fill="currentColor"></path><rect x="3.4" y="17.6" width="17.2" height="1.9" rx=".95" fill="currentColor"></rect></svg>
    </div>
    <div class="center-title">じゃあ、ここにします。</div>
    <div class="center-sub">皆さまの投票をもとに、幹事が決定しました。</div>
    <div class="decided-card" id="decidedCard"></div>
    <div class="tally" id="tallyBox"></div>
    <div class="foot-note">当日お会いできるのを楽しみにしております。</div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var state = {
    status: null,
    candidates: [],
    votes: [],
    selected: null,   // candidate_id
    myVoteId: null,   // 自分の投票済み candidate_id
    error: '',
    sending: false,
    decidedId: null
  };

  /* --- 内部リンクに ?event= を伝播(NomiApi 不在時は静的 href のまま) --- */
  if (window.NomiApi && NomiApi.link) {
    $('backLink').href = NomiApi.link('answer.html');
    $('navHome').href = NomiApi.link('index.html');
    $('navAnswer').href = NomiApi.link('answer.html');
    $('navOrganizer').href = NomiApi.link('organizer.html');
    $('navCreate').href = NomiApi.link('create.html');
  }

  function myName() {
    return $('voterName').value.trim();
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  /* --- 初期名: 条件入力の localStorage から引き継ぐ --- */
  try {
    var saved = JSON.parse(localStorage.getItem('nomicierge-s02'));
    if (saved && saved.name) $('voterName').value = saved.name;
  } catch (e) { /* なければ空のまま */ }

  $('voterName').addEventListener('input', function () {
    state.error = '';
    render();
  });

  /* --- 候補カードの描画 --- */
  function candidateCard(c) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ccard';
    btn.dataset.id = c.id;
    var votersHere = state.votes.filter(function (v) { return v.candidate_id === c.id; });
    var tags = [c.genre, c.area, c.budget_range, c.smoke].filter(Boolean)
      .map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    var chips = votersHere.map(function (v) { return '<span class="voter-chip">' + esc(v.voter_name) + '</span>'; }).join('');
    btn.innerHTML =
      '<span class="cdot"><span class="cdot-in"></span></span>' +
      '<div class="pos">0' + c.position + '</div>' +
      '<div class="nm">' + esc(c.name) + '</div>' +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
      (c.reason ? '<div class="reason">' + esc(c.reason) + '</div>' : '') +
      (c.url ? '<div class="link" style="margin-bottom:9px"><a href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer">お店の情報を見る ↗</a></div>' : '') +
      '<div class="voters"><span class="cnt">' + votersHere.length + '票</span>' + (chips || '<span>まだ投票がありません</span>') + '</div>';
    btn.addEventListener('click', function (e) {
      if (e.target.closest('a')) return; // URL リンクは選択扱いにしない
      state.selected = c.id;
      state.error = '';
      render();
    });
    return btn;
  }

  function render() {
    var isVoting = state.status === 'voting';
    var isDecided = state.status === 'decided';
    $('viewWaiting').hidden = isVoting || isDecided;
    $('viewVote').hidden = !isVoting;
    $('viewDecided').hidden = !isDecided;

    if (!NomiApi.enabled()) {
      $('waitTitle').textContent = 'まだ準備中です。';
      $('waitSub').innerHTML = 'Supabase の設定がまだのようです。<br>supabase/README.md の手順をご覧ください。';
      $('waitPulse').hidden = true;
      return;
    }

    if (isVoting) {
      var list = $('candidateList');
      list.textContent = '';
      state.candidates.forEach(function (c) {
        var card = candidateCard(c);
        card.classList.toggle('sel', state.selected === c.id);
        list.appendChild(card);
      });

      var btn = $('voteBtn');
      var ready = !!state.selected && !!myName() && !state.sending;
      btn.classList.toggle('ready', ready);
      btn.textContent = state.sending
        ? '送信中…'
        : (state.myVoteId
          ? (state.selected && state.selected !== state.myVoteId ? '投票を変更する' : '投票済み(選び直しできます)')
          : 'この店に投票する');
      $('errBox').hidden = !state.error;
      $('errBox').textContent = state.error;
    }

    if (isDecided) {
      var d = state.candidates.filter(function (c) { return c.id === state.decidedId; })[0];
      var dc = $('decidedCard');
      if (d) {
        var tags = [d.genre, d.area, d.budget_range, d.smoke].filter(Boolean)
          .map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
        dc.innerHTML =
          '<div class="nm">' + esc(d.name) + '</div>' +
          (tags ? '<div class="tags" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px">' + tags + '</div>' : '') +
          (d.url ? '<div style="font-size:12px"><a href="' + esc(d.url) + '" target="_blank" rel="noopener noreferrer">お店の情報を見る ↗</a></div>' : '');
      } else {
        dc.textContent = '決定情報を取得中…';
      }
      var tally = $('tallyBox');
      tally.innerHTML = state.candidates.map(function (c) {
        var names = state.votes
          .filter(function (v) { return v.candidate_id === c.id; })
          .map(function (v) { return esc(v.voter_name); }).join('・');
        var n = state.votes.filter(function (v) { return v.candidate_id === c.id; }).length;
        return '<div class="tally-row"><span class="k">' + esc(c.name) + (c.id === state.decidedId ? ' ★' : '') + '</span>' +
          '<span class="v">' + n + '票' + (names ? '(' + names + ')' : '') + '</span></div>';
      }).join('');
    }
  }

  /* --- 投票 --- */
  $('voteBtn').addEventListener('click', function () {
    if (state.sending) return;
    if (!myName()) { state.error = 'お名前を入れてください。'; render(); return; }
    if (!state.selected) { state.error = '行きたいお店を選んでください。'; render(); return; }
    state.sending = true;
    state.error = '';
    render();
    NomiApi.upsert('votes', {
      candidate_id: state.selected,
      voter_name: myName(),
      updated_at: new Date().toISOString()
    }, 'event_id,voter_name').then(function () {
      state.sending = false;
      state.myVoteId = state.selected;
      refresh();
      render();
    }, function (e) {
      state.sending = false;
      state.error = '投票に失敗しました(' + e.message + ')。もう一度お試しください。';
      render();
    });
  });

  /* --- データ取得(5秒ポーリング) --- */
  function refresh() {
    if (!NomiApi.enabled()) { render(); return; }
    Promise.all([
      NomiApi.getEvent(),
      NomiApi.select('candidates', 'order=position.asc'),
      NomiApi.select('votes', 'order=updated_at.asc')
    ]).then(function (results) {
      var ev = results[0];
      $('hdEventName').textContent = ev.name;
      $('hdEventInfo').textContent = ev.event_info || '';
      state.status = ev.status;
      state.decidedId = ev.decided_candidate_id;
      state.candidates = results[1];
      state.votes = results[2];
      var mine = state.votes.filter(function (v) { return v.voter_name === myName(); })[0];
      state.myVoteId = mine ? mine.candidate_id : null;
      if (!state.selected && state.myVoteId) state.selected = state.myVoteId;
      render();
    }, function () { /* 一時的な通信エラーは次のポーリングに任せる */ });
  }

  render();
  if (NomiApi.enabled()) NomiApi.startPolling(refresh, 5000);
})();
</script>
</body>
</html>
