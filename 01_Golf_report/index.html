}

}

.dossier-name-en{

.dossier-vs-par{

}

.dossier-splits{

  gap:0;
  border-top:1px solid var(--line-soft);
}
.dossier-split{

  border-right:1px solid var(--line-soft);
}
.dossier-split:last-child{border-right:0;padding-left:1.4rem}
.dossier-split:first-child{padding-right:1.4rem}
.dossier-split-label{

  font-size:10px;letter-spacing:.4em;
  color:var(--muted);
}
.dossier-split-value{
  font-family:'Playfair Display',serif;
  font-weight:500;
  font-size:1.6rem;
  color:var(--ivory);
  margin-top:.4rem;
  letter-spacing:.02em;
}
.dossier-icon{
  position:absolute;top:2.2rem;right:0;
  width:18px;height:18px;
  color:var(--ivory-dim);

}

  border-bottom:1px solid var(--line);

}
.score-table .row-label{

  font-family:'Noto Serif JP',serif;

.score-table td.double{color:var(--ivory-dim);background:rgba(125,160,180,.13)}

.score-table td.winner::before{

}
.score-table td.tie::before{
  content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:14px;height:1px;

.legend{

.summary-detail-list{font-family:'Noto Sans JP',sans-serif;font-size:13px;line-height:1.9;color:var(--ivory-dim)}
.summary-detail-list .name{color:var(--gold);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.4em;display:block;margin-bottom:.2rem}
.summary-detail-list .name.son{color:var(--sage)}

.summary-detail-list .row{padding:.6rem 0;border-top:1px solid var(--line-soft)}
.summary-detail-list .row:first-child{border-top:0}

/* --- Footer / colophon --- */
.colophon{padding-top:2rem;border-top:1px solid var(--line);display:grid;gap:2rem}
@media(min-width:768px){.colophon{grid-template-columns:2fr 1fr 1fr}}
.colophon-h{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:1.6rem;color:var(--ivory)}
.colophon-meta{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.3em;color:var(--ivory-dim);line-height:2.2}

.colophon-tail{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.45em;color:var(--muted);margin-top:3rem;text-align:center}

/* --- Reveal & motion primitives ---
   Always visible by default. GSAP uses from() to animate from a hidden
   state INTO the visible state. If GSAP fails or doesn't load, content

.reveal-up{opacity:1;transform:none}

.split-line{overflow:hidden;display:block}
.split-line .word{display:inline-block;will-change:transform,opacity}

/* --- Lucide icons baseline --- */
[data-lucide]{stroke-width:1.2;color:currentColor}
.icon-stroke-thin [data-lucide]{stroke-width:1.1}

      <div class="eyebrow">— III. Trajectory</div>
      <h2 class="section-heading mt-4">The shape of an afternoon.</h2>
      <div class="section-heading-jp mt-3">ス コ ア の 推 移</div>
    </div>
    <i data-lucide="trending-up" class="hidden md:block w-7 h-7 text-[color:var(--gold)] icon-stroke-thin"></i>
  </div>
  <div class="chart-frame reveal-up">
    <div class="chart-canvas-wrap">
      <canvas id="scoreChart"></canvas>
    </div>
  </div>
</section>

<section id="summary" class="relative max-w-6xl mx-auto px-6 py-20 md:py-28">
  <div class="flex items-end justify-between reveal-up">
    <div>
      <div class="eyebrow">— IV. Notes</div>
      <h2 class="section-heading mt-4">Three findings from the round.</h2>
      <div class="section-heading-jp mt-3">本 日 の 記 録</div>
    </div>
    <i data-lucide="bookmark" class="hidden md:block w-7 h-7 text-[color:var(--gold)] icon-stroke-thin"></i>
  </div>
  <div class="summary-grid reveal-up" id="summary-grid"></div>
</section>

<footer id="colophon" class="relative max-w-6xl mx-auto px-6 py-20 md:py-28">
  <div class="colophon">
    <div>
      <div class="eyebrow">— Colophon</div>
      <h3 class="colophon-h mt-4 italic">A record kept for one afternoon.</h3>
      <p class="lead-jp mt-4">後に振り返ったとき、ただの数字に過ぎないかもしれない。それでも、この一日は確かに在った。</p>
    </div>
    <div>
      <div class="colophon-meta">
        <div><span class="label">DATE</span><br>2026 . 04 . 29</div>
        <div class="mt-4"><span class="label">VENUE</span><br>LINEHILL G.C.</div>
      </div>
    </div>
    <div>
      <div class="colophon-meta">
        <div><span class="label">TEE</span><br>REGULAR</div>
        <div class="mt-4"><span class="label">GREEN</span><br>SUB</div>
        <div class="mt-4"><span class="label">PAR</span><br>72</div>
      </div>
    </div>
  </div>
  <div class="colophon-tail">— FIN —</div>
</footer>

</main>

<script id="match-data">
const matchData = {
  date:"2026.04.29",
  dateJp:"2026年4月29日",
  course:"Linehill Golf Club",
  courseJp:"ラインヒルゴルフクラブ",
  tee:"Regular",
  green:"Sub",
  par:[4,4,4,3,5,4,4,3,5,5,4,4,3,4,4,3,5,4],
  players:[
    {key:"father",index:"01",name:"智一",nameRomaji:"Tomoichi",role:"FATHER",roleJp:"父",scores:[6,4,5,5,7,6,4,4,5,7,4,5,5,5,7,4,5,7],accent:"#c8a85a",accentDeep:"#8a7232"},
    {key:"son",index:"02",name:"松本 孝祐",nameRomaji:"Kosuke Matsumoto",role:"SON",roleJp:"息子",scores:[7,9,7,7,7,7,8,8,7,9,7,7,8,8,7,4,8,8],accent:"#6b9a8b",accentDeep:"#3e6b5d"}
  ]
};
const sum = a => a.reduce((x,y)=>x+y,0);
const out9 = a => sum(a.slice(0,9));
const in9 = a => sum(a.slice(9,18));

function classifyCell(score, par){
  const d = score - par;
  if(d <= -1) return 'birdie';
  if(d === 0) return 'par';
  if(d === 1) return 'par';
  if(d === 2) return 'bogey';
  if(d === 3) return 'double';
  return 'triple';
}

function holeWinner(idx){
  const a = matchData.players[0].scores[idx];
  const b = matchData.players[1].scores[idx];
  if(a < b) return 'father';
  if(b < a) return 'son';
  return 'tie';
}

function buildDossier(){
  const grid = document.getElementById('dossier-grid');
  const totals = matchData.players.map(p => sum(p.scores));
  const winnerKey = totals[0] <= totals[1] ? 'father' : 'son';
  const parTotal = sum(matchData.par);

  matchData.players.forEach((p, i) => {
    const total = totals[i];
    const o = out9(p.scores);
    const inn = in9(p.scores);
    const diff = total - parTotal;
    const isWinner = p.key === winnerKey;
    const node = document.createElement('article');
    node.className = `dossier ${isWinner ? 'dossier-winner' : ''}`;
    node.innerHTML = `
      <i data-lucide="${isWinner ? 'award' : 'circle'}" class="dossier-icon"></i>
      <div class="dossier-index">
        <span>${p.index}</span>
        <span class="rule" style="display:inline-block;width:36px;height:1px;background:currentColor;opacity:.5"></span>
        <span class="role">${p.role}</span>
      </div>
      <div class="dossier-name-en">${p.nameRomaji}</div>
      <div class="dossier-name-jp">${p.name}</div>
      <div class="dossier-stat-row">
        <div class="dossier-total tabular" data-countup="${total}">0</div>
        <div class="dossier-vs-par">
          <span class="v">${diff >= 0 ? '+' : ''}${diff}</span>
          &nbsp;VS&nbsp;PAR
        </div>
      </div>
      <div class="dossier-splits">
        <div class="dossier-split">
          <div class="dossier-split-label">OUT &nbsp;1—9</div>
          <div class="dossier-split-value tabular" data-countup="${o}">0</div>
        </div>
        <div class="dossier-split">
          <div class="dossier-split-label">IN &nbsp;10—18</div>
          <div class="dossier-split-value tabular" data-countup="${inn}">0</div>
        </div>
      </div>
    `;
    grid.appendChild(node);
  });
}

function buildScoreTable(){
  const t = document.getElementById('scoreTable');
  const par = matchData.par;
  const winners = par.map((_,i) => holeWinner(i));

  let head = '<thead><tr><th class="row-label">HOLE</th>';
  for(let i=1;i<=9;i++) head += `<th>${String(i).padStart(2,'0')}</th>`;
  head += '<th>OUT</th>';
  for(let i=10;i<=18;i++) head += `<th>${i}</th>`;
  head += '<th>IN</th><th>TOTAL</th></tr></thead>';

  let body = '<tbody>';
  body += '<tr class="par-row"><td class="row-label">PAR</td>';
  for(let i=0;i<9;i++) body += `<td>${par[i]}</td>`;
  body += `<td class="subtotal">${out9(par)}</td>`;
  for(let i=9;i<18;i++) body += `<td>${par[i]}</td>`;
  body += `<td class="subtotal">${in9(par)}</td><td class="total">${sum(par)}</td></tr>`;

  matchData.players.forEach(p => {
    body += `<tr><td class="row-label">${p.name}<span class="sub">${p.role}</span></td>`;
    for(let i=0;i<9;i++){
      const cls = classifyCell(p.scores[i], par[i]);
      const w = winners[i];
      const wcls = w === p.key ? 'winner' : (w === 'tie' ? 'tie' : '');
      body += `<td class="cell ${cls} ${wcls}">${p.scores[i]}</td>`;
    }
    body += `<td class="subtotal">${out9(p.scores)}</td>`;
    for(let i=9;i<18;i++){
      const cls = classifyCell(p.scores[i], par[i]);
      const w = winners[i];
      const wcls = w === p.key ? 'winner' : (w === 'tie' ? 'tie' : '');
      body += `<td class="cell ${cls} ${wcls}">${p.scores[i]}</td>`;
    }
    body += `<td class="subtotal">${in9(p.scores)}</td><td class="total">${sum(p.scores)}</td></tr>`;
  });
  body += '</tbody>';
  t.innerHTML = head + body;
  return winners;
}

function buildSummary(winners){
  const grid = document.getElementById('summary-grid');
  const fatherWins = winners.filter(w => w === 'father').length;
  const sonWins = winners.filter(w => w === 'son').length;
  const ties = winners.filter(w => w === 'tie').length;

  const par = matchData.par;
  const fDiffs = matchData.players[0].scores.map((s,i)=>s-par[i]);
  const sDiffs = matchData.players[1].scores.map((s,i)=>s-par[i]);
  const fParHoles = fDiffs.map((d,i)=>d===0 ? i+1 : null).filter(x=>x);
  const sBestIdx = sDiffs.indexOf(Math.min(...sDiffs));
  const fWorst = Math.max(...fDiffs);
  const sWorst = Math.max(...sDiffs);
  const fWorstHoles = fDiffs.map((d,i)=>d===fWorst ? i+1 : null).filter(x=>x);
  const sWorstHoles = sDiffs.map((d,i)=>d===sWorst ? i+1 : null).filter(x=>x);

  const cells = [
    {
      eyebrow:'Match Play',
      icon:'trophy',
      title:'Holes won across the round.',
      body:`
        <div class="summary-display tabular">
          <div>
            <span class="summary-num gold" data-countup="${fatherWins}">0</span>
            <span class="summary-mini-label">FATHER</span>
          </div>
          <span class="summary-divider"></span>
          <div>
            <span class="summary-num" data-countup="${ties}">0</span>
            <span class="summary-mini-label">HALVED</span>
          </div>
          <span class="summary-divider"></span>
          <div>
            <span class="summary-num sage" data-countup="${sonWins}">0</span>
            <span class="summary-mini-label">SON</span>
          </div>
        </div>
        <p class="text-[11px] tracking-[.3em] font-cinzel text-[color:var(--muted)] mt-2">OF EIGHTEEN HOLES</p>
      `
    },
    {
      eyebrow:'Highlight',
      icon:'star',
      title:'Moments worth keeping.',
      body:`
        <div class="summary-detail-list">
          <div class="row">
            <span class="name">FATHER</span>
            ${fParHoles.length} holes finished on par.
            <div class="holes mt-2">No. ${fParHoles.join(' / ')}</div>
          </div>
          <div class="row">
            <span class="name son">SON</span>
            Hole ${sBestIdx+1}, par 3 — finished in ${matchData.players[1].scores[sBestIdx]} (+${sDiffs[sBestIdx]}).
            <div class="holes mt-2">The single bogey of the day.</div>
          </div>
        </div>
      `
    },
    {
      eyebrow:'Hardships',
      icon:'flag',
      title:'Where the round bent.',
      body:`
        <div class="summary-detail-list">
          <div class="row">
            <span class="name">FATHER</span>
            Worst hole: +${fWorst} at No. ${fWorstHoles.join(' / ')}.
          </div>
          <div class="row">
            <span class="name son">SON</span>
            Worst hole: +${sWorst} at No. ${sWorstHoles.join(' / ')}.
          </div>
        </div>
      `
    }
  ];

  cells.forEach(c => {
    const node = document.createElement('div');
    node.className = 'summary-cell';
    node.innerHTML = `
      <div class="flex items-center gap-3">
        <i data-lucide="${c.icon}" class="summary-icon"></i>
        <span class="summary-eyebrow">${c.eyebrow}</span>
      </div>
      <div class="summary-title">${c.title}</div>
      ${c.body}
    `;
    grid.appendChild(node);
  });
}

function initChart(){
  const ctx = document.getElementById('scoreChart').getContext('2d');
  const labels = matchData.par.map((_,i)=>String(i+1).padStart(2,'0'));
  new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'PAR',
          data:matchData.par,
          borderColor:'rgba(244,237,225,.35)',
          borderDash:[2,5],
          borderWidth:1,
          pointRadius:0,
          tension:0
        },
        {
          label:'Tomoichi',
          data:matchData.players[0].scores,
          borderColor:'#c8a85a',
          backgroundColor:'rgba(200,168,90,.1)',
          borderWidth:2,
          pointRadius:4,
          pointBackgroundColor:'#0b0d10',
          pointBorderColor:'#c8a85a',
          pointBorderWidth:1.5,
          tension:.32,
          fill:false
        },
        {
          label:'Kosuke',
          data:matchData.players[1].scores,
          borderColor:'#6b9a8b',
          backgroundColor:'rgba(107,154,139,.08)',
          borderWidth:1.6,
          borderDash:[6,4],
          pointRadius:4,
          pointBackgroundColor:'#0b0d10',
          pointBorderColor:'#6b9a8b',
          pointBorderWidth:1.5,
          tension:.32,
          fill:false
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      layout:{padding:{top:8,right:12,bottom:6,left:6}},
      plugins:{
        legend:{
          align:'end',
          labels:{
            color:'#cdc4b3',
            font:{family:'Cinzel',size:11,weight:'600'},
            usePointStyle:true,
            padding:18,
            boxWidth:10,
            boxHeight:10
          }
        },
        tooltip:{
          backgroundColor:'rgba(8,9,11,.95)',
          borderColor:'rgba(200,168,90,.35)',
          borderWidth:1,
          titleColor:'#c8a85a',
          titleFont:{family:'Cinzel',size:11,weight:'700'},
          bodyColor:'#f4ede1',
          bodyFont:{family:'Cinzel',size:12},
          padding:14,
          displayColors:false,
          callbacks:{
            title:(items)=>`HOLE ${items[0].label}`,
            label:(c)=>{
              if(c.dataset.label==='PAR') return `PAR  ·  ${c.parsed.y}`;
              const p = matchData.par[c.dataIndex];
              const d = c.parsed.y - p;
              const sign = d >= 0 ? '+' : '';
              return `${c.dataset.label.toUpperCase()}  ·  ${c.parsed.y}  (${sign}${d})`;
            }
          }
        }
      },
      scales:{
        x:{
          grid:{color:'rgba(244,237,225,.05)',drawTicks:false},
          border:{color:'rgba(244,237,225,.1)'},
          ticks:{color:'#8a8b8e',font:{family:'Cinzel',size:11},padding:8}
        },
        y:{
          grid:{color:'rgba(244,237,225,.05)',drawTicks:false},
          border:{display:false},
          ticks:{color:'#8a8b8e',stepSize:1,font:{family:'Cinzel',size:11},padding:8},
          suggestedMin:2,
          suggestedMax:10
        }
      }
    }
  });
}

function initParticles(){
  if(typeof tsParticles === 'undefined') return;
  tsParticles.load({
    id:'ts-bg',
    options:{
      fpsLimit:60,
      background:{color:'transparent'},
      particles:{
        number:{value:14,density:{enable:true,area:1200}},
        color:{value:['#c8a85a','#e6cf95']},
        shape:{type:'circle'},
        opacity:{value:.18,random:{enable:true,minimumValue:.05}},
        size:{value:{min:.5,max:1.6}},
        move:{enable:true,speed:.25,direction:'top',random:true,straight:false,outModes:{default:'out'}}
      },
      detectRetina:true
    }
  });
}

function startCountUps(root){
  const els = (root||document).querySelectorAll('[data-countup]:not([data-counted])');
  els.forEach(el => {
    const target = parseInt(el.dataset.countup,10);
    el.dataset.counted = '1';
    if(window.countUp && countUp.CountUp){
      const cu = new countUp.CountUp(el, target, {duration:1.8,useEasing:true});
      if(!cu.error) cu.start(); else el.textContent = target;
    } else { el.textContent = target; }
  });
}

function initSmoothScroll(){
  if(typeof Lenis === 'undefined') return null;
  // Skip Lenis on touch devices — native iOS scrolling is smoother
  // and avoids any compat issues that could break the page.
  const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if(isTouch) return null;
  const lenis = new Lenis({duration:1.2,easing:t => Math.min(1, 1.001 - Math.pow(2, -10 * t))});
  function raf(time){lenis.raf(time);requestAnimationFrame(raf)}
  requestAnimationFrame(raf);
  if(window.gsap && window.ScrollTrigger){
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time)=>lenis.raf(time*1000));
    gsap.ticker.lagSmoothing(0);
  }
  return lenis;
}

function initSplittingAndReveal(){
  if(window.Splitting) try { Splitting(); } catch(e){ console.warn('Splitting failed', e); }
  if(!window.gsap){ startCountUps(document); return; }
  if(window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);

  // Hero: from-state animation (content is visible by default; gsap.from
  // animates FROM a hidden state INTO current visible state).
  gsap.from('[data-hero-line]', {
    opacity:0,
    y:24,
    duration:1.2,
    stagger:.12,
    ease:'power3.out',
    delay:.15,
    immediateRender:false
  });

  // Prologue: char-by-char (only if Splitting actually wrapped chars)
  if(window.ScrollTrigger){
    document.querySelectorAll('#prologue [data-splitting]').forEach(p => {
      const chars = p.querySelectorAll('.char');
      if(!chars.length) return;
      gsap.fromTo(chars,
        {opacity:.18},
        {opacity:1, ease:'none', stagger:.012,
         scrollTrigger:{trigger:p,start:'top 80%',end:'bottom 60%',scrub:.7}}
      );
    });
  }

  // Generic reveal-up: from-state, content visible by default.
  if(window.ScrollTrigger){
    gsap.utils.toArray('.reveal-up').forEach(el => {
      gsap.from(el,{
        opacity:0,
        y:34,
        duration:1,
        ease:'power3.out',
        immediateRender:false,
        scrollTrigger:{
          trigger:el,
          start:'top 85%',
          toggleActions:'play none none none',
          onEnter:()=>startCountUps(el)
        }
      });
    });
  }

  // Trigger countups already in viewport
  startCountUps(document);
}

function initLucide(){
  if(window.lucide && lucide.createIcons) lucide.createIcons();
}

function forceShowAll(){
  document.querySelectorAll('.reveal-up,.reveal-fade,[data-hero-line]').forEach(el => {
    el.style.opacity = '1';
    el.style.transform = 'none';
  });
  startCountUps(document);
}

function safeRun(label, fn){
  try { fn(); }
  catch(e){ console.warn('[init] '+label+' failed:', e); }
}

document.addEventListener('DOMContentLoaded', () => {
  // Content is always visible by CSS default. JS only adds animations
  // and dynamic content. If anything throws, nothing is hidden.
  safeRun('dossier', buildDossier);
  let winners = [];
  safeRun('table', () => { winners = buildScoreTable(); });
  safeRun('summary', () => buildSummary(winners));
  safeRun('lucide', initLucide);
  safeRun('particles', initParticles);
  safeRun('chart', initChart);
  safeRun('smoothScroll', initSmoothScroll);
  safeRun('reveal', initSplittingAndReveal);

  // Always run countups (will no-op if already counted)
  setTimeout(()=>startCountUps(document), 400);
});
</script>
