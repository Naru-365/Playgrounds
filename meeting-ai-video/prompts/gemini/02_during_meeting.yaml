# =====================================================================
# Gemini（Veo系）動画生成プロンプト: 第2章「会議中」
# 使い方は prompts/gemini/01_before_meeting.yaml の冒頭コメントと同じ。
# 服装・髪型は第1章と完全に同一（同じ日の出来事）。
# =====================================================================

meta:
  section: "during_meeting"
  cut_count: 6
  total_seconds: 70
  aspect_ratio: "16:9"
  resolution: "1920x1080"
  fps: 24
  language_of_dialogue: "Japanese (ja-JP)"
  location: "meeting_room"

shared:
  negative: &neg >
    text overlays, captions, subtitles, watermarks, logos, brand names, readable UI text
    on screens, fake software interfaces, dense small text, futuristic sci-fi office,
    holograms, neon lighting, robots, glowing AI effects, exaggerated acting, slapstick,
    distorted faces, extra fingers, deformed hands, changing hairstyle, changing
    eyeglasses, changing clothes, many visible meeting participants, camera shake,
    fisheye lens, dutch angle, heavy lens flare, anime, cartoon, 3d render, cgi look,
    oversaturated colors, night scene.

  meeting_room_setting: >
    Setting: a small meeting room in a modern Japanese office, with a glass wall facing an
    open-plan floor. A light wood table for six, dark gray chairs, a large wall-mounted
    display at the far end that is switched on but shows only a soft blurred glow with no
    readable interface, a small round conference speakerphone at the center of the table,
    a side whiteboard with faint unreadable marker strokes, soft daylight coming through
    the glass wall.

